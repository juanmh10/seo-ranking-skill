name: CI & Security Audits

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks on Git history
        run: gitleaks git --config .gitleaks.toml --verbose --redact

      - name: Run Gitleaks on working tree
        run: gitleaks dir . --config .gitleaks.toml --verbose --redact

  skill-and-repo-audit:
    name: Skill, Zip & Exposure Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify skill package parity
        run: python3 scripts/package_skill.py --check

      - name: Run repository, evals & exposure audit
        run: python3 scripts/audit_repo.py

  backend-test-and-audit:
    name: Backend Tests, Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e './backend[dev]' bandit pip-audit

      - name: Ruff lint
        run: |
          ruff check backend/app backend/tests
          ruff check scripts .agents/skills/geo-llm-ranking/scripts

      - name: Run pytest
        run: pytest backend/tests -q

      - name: Run Bandit SAST (medium/high severity)
        run: bandit -r backend/app -ll

      - name: Run pip-audit dependency check
        continue-on-error: true
        run: pip-audit --desc

  frontend-test-and-audit:
    name: Frontend Tests, Build & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Test frontend
        run: pnpm --dir frontend test

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Run pnpm dependency audit
        continue-on-error: true
        run: pnpm --dir frontend audit --audit-level=high
